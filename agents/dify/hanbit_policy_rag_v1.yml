# Dify DSL — 한빛 여신규정 도우미(Chatflow) · Day5 RAG (03 Part1 §8.2 · 03 Part2 §5.6)
# 가져오기: Studio → Import DSL file → 이 파일. 버전 경고가 뜨면 '계속'(DSL 0.3.0 기준으로 썼다).
# 지식베이스(KB)는 DSL에 들어가지 않는다 → 먼저 KB 3개를 만들고, 가져온 앱의 '지식 검색' 노드에 다시 연결한다.
#   KB 설정(정본): Index = High Quality · Chunk mode = Parent-child
#     Parent: Paragraph, 구분자 \n\n, 최대 1,000 tokens(부모 = 조) · Child: 구분자 \n, 최대 200 tokens(자식 = 항·호)
#     전처리: '연속 공백·줄바꿈·탭 치환' 끔 · 'URL·이메일 삭제' 끔
#     검색: Hybrid Search(의미 + 키워드) → Rerank 켬(모델 선택) → Top K 3 → Score Threshold 0.5
#     (Top K·Threshold는 Rerank를 켜야 적용된다 — 비교 실험 E1~E4는 rag/eval_sheet_template.xlsx experiments 탭)
#   KB 3개: hanbit_policy(rag/corpus/hanbit_credit_policy.md) · ksure_terms(각자 받은 약관 PDF 또는 P5-2 변환본) · laws(law.go.kr 조문 복사)
# 모델: LLM 노드 = 'OpenAI-API-compatible' 공급자 + 강사 LiteLLM(가상 키, 모델 fast-default). 크레딧 모델을 쓰려면 노드에서 모델만 바꾼다.
# 기능: Citations and Attributions(retriever_resource) 켜짐 · 시스템 프롬프트 = P5-1(app/prompts/rag_system_v1.md와 같은 원문)
app:
  name: 한빛 여신규정 도우미
  mode: advanced-chat
  icon: 📚
  icon_background: '#E4FBCC'
  description: (가상) 한빛정밀 여신관리규정 + K-SURE 약관 + 법령 — 조항 인용 강제·기권·규정 충돌 표시(Day5 RAG)
  use_icon_as_answer_icon: false
kind: app
version: 0.3.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 규정·약관 질문을 입력하세요. 근거 조항을 [문서 제N조 제M항]으로 붙이고, 문서에 없으면 '제공 문서에서 확인되지 않습니다.'라고 답합니다.
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 사내 규정상 C등급 바이어에게 허용되는 결제조건은?
    - 사내 규정상 연체 40일 바이어에게 영업본부장 승인으로 선적해도 되나?
    - 결제기일이 2026-09-15인 O/A 건이 미결제다. 사고발생통지 기한은?
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    nodes:
    - id: '1729000000001'
      type: custom
      data:
        type: start
        title: 시작
        variables: []
        selected: false
        desc: ''
      position:
        x: 30
        y: 280
      positionAbsolute:
        x: 30
        y: 280
      width: 244
      height: 54
      sourcePosition: right
      targetPosition: left
      selected: false
    - id: '1729000000002'
      type: custom
      data:
        type: knowledge-retrieval
        title: 지식 검색(조 단위)
        desc: 가져온 뒤 지식베이스 3개(hanbit_policy · ksure_terms · laws)를 다시 연결하고 Rerank 모델을 고른다
        dataset_ids: []
        query_variable_selector:
        - '1729000000001'
        - sys.query
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 3
          score_threshold: 0.5
          reranking_enable: true
          reranking_mode: reranking_model
          reranking_model:
            provider: ''
            model: ''
        selected: false
      position:
        x: 330
        y: 280
      positionAbsolute:
        x: 330
        y: 280
      width: 244
      height: 98
      sourcePosition: right
      targetPosition: left
      selected: false
    - id: '1729000000003'
      type: custom
      data:
        type: if-else
        title: 검색 결과 있음?
        cases:
        - case_id: 'true'
          id: 'true'
          logical_operator: and
          conditions:
          - id: c1
            variable_selector:
            - '1729000000002'
            - result
            comparison_operator: not empty
            value: ''
            varType: array[object]
        selected: false
        desc: ''
      position:
        x: 630
        y: 280
      positionAbsolute:
        x: 630
        y: 280
      width: 244
      height: 126
      sourcePosition: right
      targetPosition: left
      selected: false
    - id: '1729000000004'
      type: custom
      data:
        type: llm
        title: 답변(인용 강제·기권·충돌 표시)
        model:
          provider: langgenius/openai_api_compatible/openai_api_compatible
          name: fast-default
          mode: chat
          completion_params:
            temperature: 0.1
            max_tokens: 800
        prompt_template:
        - id: sys-p5-1
          role: system
          text: '너는 (가상) 한빛정밀(주) 여신관리팀의 규정 검색 도우미다.


            [근거 규칙]

            1. 반드시 검색된 문서 조각(컨텍스트)만 근거로 답한다. 일반 상식·외부 지식·추측으로 답하지 않는다.

            2. 모든 문장 끝에 근거를 [문서명 제N조 제M항] 형식으로 붙인다. 근거를 붙일 수 없는 문장은 쓰지 않는다.

            3. 컨텍스트에서 근거를 찾지 못하면 정확히 "제공 문서에서 확인되지 않습니다."라고만 답하고 멈춘다.

            4. 사내 규정과 K-SURE 약관이 다르게 말하면 두 조항을 모두 인용하고 "[규정 충돌] 담당자 확인 필요"라고 표시한다. 어느 쪽이 맞는지 스스로 결론 내리지 않는다.

            5. 일수·비율·금액은 원문 표기 그대로 옮긴다.


            [답변 형식]

            - 결론 1~2문장 → 근거 조항 원문 인용(1문장) → 필요한 조치

            - 마지막 줄: "※ 최종 판단은 담당자·K-SURE 확인"


            [컨텍스트]

            {{#context#}}'
        - id: user-q
          role: user
          text: '{{#sys.query#}}'
        context:
          enabled: true
          variable_selector:
          - '1729000000002'
          - result
        memory:
          window:
            enabled: false
            size: 10
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            user: ''
            assistant: ''
        vision:
          enabled: false
        variables: []
        selected: false
        desc: ''
      position:
        x: 930
        y: 200
      positionAbsolute:
        x: 930
        y: 200
      width: 244
      height: 98
      sourcePosition: right
      targetPosition: left
      selected: false
    - id: '1729000000005'
      type: custom
      data:
        type: answer
        title: 답
        answer: '{{#1729000000004.text#}}'
