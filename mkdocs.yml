# 과정 사이트 설정 — MkDocs Material 9.7 (requirements-docs.txt로 버전 고정)
#
# 로컬에서 보기 (저장소 루트에서):
#   pip install -r requirements-docs.txt
#   python tools/sync_site_assets.py        # 1) 수강생용 파일을 docs/downloads/ 로 복사 + 파일 표 갱신
#   mkdocs serve                             # 2) http://127.0.0.1:8000 에서 미리 보기
#   mkdocs build --strict -d site            # 3) 정적 사이트를 site/ 에 만든다(경고가 하나라도 있으면 실패)
#   OFFLINE=true mkdocs build -d site        # (USB·file:// 배포판) 검색까지 오프라인으로 동작
#
# 배포: .github/workflows/pages.yml (main에 push하면 GitHub Pages로 배포)

site_name: 생성형 AI 기반 무역 금융 리스크 최적화 과정
site_description: (가상) 한빛정밀(주) 데이터 하나로 교수계획서의 파이프라인 6단계를 따라가는 6일 실습 과정의 수강생 사이트 — 강의 요약과 실습 가이드
site_author: 한태구
# 배포 주소(GitHub Pages): brainini/tradefin-ai-2026 — 다른 조직·이름으로 옮기면 아래 세 줄을 함께 바꾼다(CHECKLIST_D-1 §2-2).
#   site_url이 비어 있으면 404 페이지의 링크·스타일이 저장소 하위 주소(/tradefin-ai-2026/)에서 깨진다.
site_url: https://brainini.github.io/tradefin-ai-2026/
repo_url: https://github.com/brainini/tradefin-ai-2026
repo_name: tradefin-ai-2026
copyright: >-
  코드 MIT · 합성 데이터·문서 CC BY 4.0 · SEC 공시 발췌는 공개 공시의 교육용 일부 인용 ·
  (가상) 한빛정밀(주)·Halden은 교육용 가상 회사이며 실존 기업과 무관합니다

# file:// 로 열어도 링크가 깨지지 않도록 page.html 형태의 주소를 쓴다
use_directory_urls: false

theme:
  name: material
  language: ko
  font:
    text: Noto Sans KR
    code: Nanum Gothic Coding
  icon:
    logo: material/finance
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로 바꾸기
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로 바꾸기
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link        # 🟢/🔵/🟣 탭을 한 번 고르면 다른 Lab 페이지에서도 같은 트랙이 열린다
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

hooks:
  - tools/mkdocs_hooks.py      # docs/downloads/ 의 .md 파일(보고서 발췌 등)을 페이지가 아닌 '내려받을 파일'로 복사

plugins:
  - search:
      lang:
        - ko
        - en
      # 한국어 문서용 분리 기호: 공백·가운뎃점(·)·괄호·쉼표·슬래시 등에서 낱말을 나눈다
      separator: '[\s​　\-_,:;!?/|()\[\]{}<>=·…~"`]+|\.(?!\d)'
  - offline:
      enabled: !ENV [OFFLINE, false]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - sane_lists               # 번호 목록이 중간 설명 뒤에도 7. 8. … 처럼 이어지게(시작 번호 존중)
  - toc:
      permalink: true
      # 한글 제목도 앵커가 생기게(소문자). 'P1-4 …'처럼 프롬프트 ID로 시작하는 제목은
      # tools/mkdocs_hooks.py가 앵커를 ID만으로(#p1-4) 바꾼다 → 제목 글자가 바뀌어도 링크 유지
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ["."]         # 저장소 루트 기준 — labs/day1/prompts.md 를 그대로 끼워 넣는다
      check_paths: false       # 아직 없는 파일은 비워 둔 채 빌드(파일이 생기면 자동으로 들어간다)

# docs/ 안에 있지만 사이트에 올리지 않는 것
#  - _snippets/ : 다른 페이지에 끼워 넣는 조각(tools/sync_site_assets.py가 만든다)
#  - assets/day1/ : Day1 정답 차트(정제 150개사 피벗 결과) — 실습 전에 공개하면 안 되므로 빌드에서 뺀다
exclude_docs: |
  _snippets/
  assets/day1/

# 메뉴에 없지만 빌드하는 페이지 — 옛 주소(v2 Lab1–3)로 들어온 사람을 실습 A·B로 안내하는 한 줄짜리 페이지
not_in_nav: |
  day1/lab1.md
  day1/lab2.md
  day1/lab3.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  # v3 사이트 맵(20_강의계획안_v3 §5.2). 일차 페이지 = 개요(index) · 이론 요약(theory) · 실습 A(4–5교시) · 실습 B(6–7교시).
  # 1일차 v2 Lab1–3 페이지는 실습 A·B로 합쳤다 — day1/lab1–3.md는 옛 주소용 안내 한 줄만 남기고 메뉴에서 뺐다(위 not_in_nav).
  - 홈: index.md
  - 과정 소개: course.md
  - 사전 준비: setup.md
  - "1일차 · 10/14(수)":
      - day1/index.md
      - "이론 요약": day1/theory.md
      - "실습 A (4–5교시)": day1/lab-a.md
      - "실습 B (6–7교시)": day1/lab-b.md
  - "2일차 · 10/15(목)":
      - day2/index.md
      - "이론 요약": day2/theory.md
      - "실습 A (4–5교시)": day2/lab-a.md
      - "실습 B (6–7교시)": day2/lab-b.md
  - "3일차 · 10/16(금)":
      - day3/index.md
      - "이론 요약": day3/theory.md
      - "실습 A (4–5교시)": day3/lab-a.md
      - "실습 B (6–7교시)": day3/lab-b.md
  - "4일차 · 10/19(월)":
      - day4/index.md
      - "이론 요약": day4/theory.md
      - "실습 A (4–5교시)": day4/lab-a.md
      - "실습 B (6–7교시)": day4/lab-b.md
  - "5일차 · 10/20(화)":
      - day5/index.md
      - "이론 요약": day5/theory.md
      - "실습 A (4–5교시)": day5/lab-a.md
      - "실습 B (6–7교시)": day5/lab-b.md
  - "6일차 · 10/21(수) 해커톤":
      - day6/index.md
      - "위기 카드": day6/cards.md
      - "솔루션 킷": day6/kit.md
      - "심사 기준": day6/judging.md
      - "제출": day6/submit.md
  - 기초 지식:
      - foundations/index.md
      - "F1 내 데이터는 어디로 가나": foundations/f1.md
      - "F2 웹·API, 그리고 첫 커밋": foundations/f2.md
      - "F3 같은 입력이면 같은 결과": foundations/f3.md
      - "F4 프로그램은 언제 도는가": foundations/f4.md
      - "F5 내 PC의 앱을 모두의 앱으로": foundations/f5.md
      - "F6 솔루션 킷 = 저장소 하나": foundations/f6.md
  - "Standard 트랙: 내 업무 데이터로": ax-project.md
  - 프롬프트 라이브러리:
      - "1일차 (P1-1~P1-8)": prompts/day1.md
      - "2일차 (P2-1~P2-4)": prompts/day2.md
      - "3일차 (P3-0~P3-3)": prompts/day3.md
      - "4일차 (P4-1~P4-3)": prompts/day4.md
      - "5일차 (P5-1~P5-7)": prompts/day5.md
      - "6일차 (P6-1~P6-7)": prompts/day6.md
  - 용어집: glossary.md
  - 데이터: data.md
  - FAQ·트러블슈팅: faq.md
  - 참고문헌: references.md
